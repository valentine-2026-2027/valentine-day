<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Валентинка 💕</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #ff6b9d, #c44569, #f7931e);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }
        .flags {
            position: fixed; top: 12px; right: 12px; display: flex; gap: 10px; z-index: 1000;
        }
        .flag-btn {
            width: 46px; height: 34px; border: 2px solid rgba(255,255,255,0.5);
            border-radius: 6px; overflow: hidden; cursor: pointer; transition: all 0.2s;
        }
        .flag-btn:hover { transform: scale(1.1); border-color: white; }
        .flag-btn img { width: 100%; height: 100%; object-fit: cover; }
        .flag-btn.active { border-color: white; box-shadow: 0 0 0 3px rgba(255,255,255,0.7); }

        #generator, #valentines {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px 15px; text-align: center;
        }
        h1 {
            font-size: clamp(2.3rem, 7.5vw, 4.2rem); margin-bottom: 30px;
            line-height: 1.2; text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }
        .name { color: #fff200; text-shadow: 0 0 20px #ff00aa; }
        input {
            padding: 16px 24px; font-size: 1.4rem; width: 100%; max-width: 420px;
            border-radius: 999px; border: none; margin: 20px 0; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn {
            padding: 16px 48px; font-size: 1.4rem; font-weight: bold;
            border: none; border-radius: 999px; cursor: pointer; margin: 12px 8px;
            min-width: 160px; box-shadow: 0 6px 20px rgba(0,0,0,0.35); transition: all 0.25s;
        }
        .btn:active { transform: scale(0.96); }
        #createBtn { background: #00ff9d; color: #000; }
        #createBtn:hover { transform: scale(1.06); }
        .yes { background: #00ff9d; color: #000; }
        .no { background: #ff4444; color: white; position: relative; }
        .no.moved {
            position: fixed !important;
            transform: scale(0.7);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        #qrContainer {
            margin: 40px 0 20px; background: white; padding: 20px;
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
        .heart {
            position: absolute; font-size: 2rem; animation: fall linear forwards; opacity: 0.85;
        }
        @keyframes fall {
            0% { transform: translateY(-15vh) translateX(var(--x)) rotate(0deg); opacity: 1; }
            100% { transform: translateY(115vh) translateX(calc(var(--x) + var(--drift))) rotate(1080deg); opacity: 0; }
        }
        .hidden { display: none !important; }
        .back-link {
            margin-top: 60px;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .back-link a {
            color: #fff200;
            text-decoration: none;
            border-bottom: 2px solid #fff200;
            padding-bottom: 3px;
            transition: all 0.2s;
        }
        .back-link a:hover {
            color: white;
            border-color: white;
        }
        /* CAPTCHA стилі */
        #captchaModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #captchaContent {
            background: linear-gradient(135deg, #005BBB, #FFD500, #E31A1C); padding: 40px;
            border-radius: 20px; max-width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            max-height: 85vh; overflow-y: auto; border: 4px solid white;
        }
        #captchaContent h2 { font-size: 2.2rem; margin-bottom: 25px; text-shadow: 2px 2px 4px black; }
        #captchaContent p { font-size: 1.3rem; margin-bottom: 20px; font-weight: bold; }
        #captchaInput, #captchaInput2 {
            padding: 15px; font-size: 1.4rem; width: 85%; max-width: 400px;
            border-radius: 12px; border: none; text-align: center; margin: 15px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        #captchaBtn, #captchaBtn2 {
            padding: 16px 40px; font-size: 1.3rem; background: #00ff9d; color: #000;
            border: none; border-radius: 12px; cursor: pointer; margin-top: 15px;
            font-weight: bold; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        @media (max-width: 500px) {
            .btn { padding: 14px 36px; font-size: 1.2rem; min-width: 140px; }
            h1 { font-size: 2.4rem; }
            #captchaContent { padding: 25px; }
            #captchaContent h2 { font-size: 1.8rem; }
            #captchaInput, #captchaInput2 { font-size: 1.2rem; padding: 12px; }
        }
    </style>
</head>
<body>

<div class="flags">
    <button class="flag-btn active" data-lang="uk" onclick="setLang('uk')"><img src="https://flagcdn.com/w40/ua.png" alt="UA"></button>
    <button class="flag-btn" data-lang="en" onclick="setLang('en')"><img src="https://flagcdn.com/w40/gb.png" alt="GB"></button>
</div>

<div class="hearts" id="hearts"></div>

<div id="generator">
    <h1>Створи свою валентинку 💕</h1>
    <input type="text" id="nameInput" placeholder="Введи ім'я..." autocomplete="off">
    <button id="createBtn" class="btn">Створити →</button>
</div>

<div id="valentines" class="hidden">
    <h1 id="mainTitle">Ти будеш моєю валентинкою, <span class="name" id="valName">...</span>? 💕</h1>

    <div>
        <button id="yesBtn" class="btn yes">Так 😍</button>
        <button id="noBtn" class="btn no">Ні ❌</button>
    </div>

    <div id="qrContainer" class="hidden">
        <div id="qrcode"></div>
        <p id="qrText" style="color:#333; margin-top:12px;">Скануй, щоб відкрити</p>
    </div>

    <div id="shareButtons" class="hidden">
        <button class="btn" onclick="downloadQR()">Скачати QR</button>
        <button class="btn" onclick="copyLink()">Скопіювати посилання</button>
    </div>

    <div class="back-link">
        Хочеш створити валентинку для когось іншого? → 
        <a href="https://valentine-2026-2027.github.io/valentine-day/" target="_blank">Створити нову</a>
    </div>
</div>

<!-- CAPTCHA модалка -->
<div id="captchaModal">
    <div id="captchaContent">
        <h2 id="captchaTitle">Патріотична перевірка 🇺🇦</h2>
        <p id="captchaQuestion1"></p>
        <input type="text" id="captchaInput" placeholder="Твоя відповідь..." autocomplete="off">
        <button id="captchaBtn">Перевірити</button>

        <p id="captchaQuestion2" style="display:none; margin-top:30px;"></p>
        <input type="text" id="captchaInput2" placeholder="Твоя відповідь..." autocomplete="off" style="display:none;">
        <button id="captchaBtn2" style="display:none;">Перевірити</button>
    </div>
</div>

<script>
const texts = {
    uk: {
        title: "Ти будеш моєю валентинкою, ",
        titleEnd: "? 💕",
        yes: "Так 😍",
        no: "Ні ❌",
        create: "Створити →",
        placeholder: "Введи ім'я...",
        qrText: "Скануй, щоб відкрити",
        alertYes: "Я знав(ла), що скажеш ТАК! 😍💖",
        alertNo: "Ну як то ні? 😭",
        invalidName: "Невірне ім'я. Тільки літери (укр/англ)",
        captchaTitle: "Патріотична перевірка 🇺🇦",
        q1: "Слава Україні!",
        q1Answer: "героям слава",
        q1Success: "Героям слава! 🇺🇦🔥",
        q2: "Як називаються українські війська (укорочено)?",
        q2Answer: "ЗСУ",
        q2Success: "Слава ЗСУ! 💪🇺🇦"
    },
    en: {
        title: "Will you be my valentine, ",
        titleEnd: "? 💕",
        yes: "Yes 😍",
        no: "No ❌",
        create: "Create →",
        placeholder: "Enter name...",
        qrText: "Scan to open",
        alertYes: "I knew you'd say YES! 😍💖",
        alertNo: "How can it be no? 😭",
        invalidName: "Invalid name. Only letters (Ukr/Eng)",
        captchaTitle: "Patriotic Check 🇺🇦",
        q1: "Glory to Ukraine!",
        q1Answer: "glory to the heroes",
        q1Success: "Glory to the heroes! 🇺🇦🔥",
        q2: "What's the name of Ukrainian army (short)?",
        q2Answer: "AFU",
        q2Success: "Glory to AFU! 💪🇺🇦"
    }
};

let lang = 'uk';
const urlParams = new URLSearchParams(window.location.search);
let name = urlParams.get('name');
name = name ? decodeURIComponent(name).trim() : '';
const share = urlParams.get('share') !== 'false';

const generator = document.getElementById('generator');
const valentines = document.getElementById('valentines');
const mainTitle = document.getElementById('mainTitle');
const valNameSpan = document.getElementById('valName');
const nameInput = document.getElementById('nameInput');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const createBtn = document.getElementById('createBtn');
const qrContainer = document.getElementById('qrContainer');
const qrDiv = document.getElementById('qrcode');
const qrTextP = document.getElementById('qrText');
const shareButtons = document.getElementById('shareButtons');

// CAPTCHA
const captchaModal = document.getElementById('captchaModal');
const captchaTitle = document.getElementById('captchaTitle');
const captchaQuestion1 = document.getElementById('captchaQuestion1');
const captchaInput = document.getElementById('captchaInput');
const captchaBtn = document.getElementById('captchaBtn');
const captchaQuestion2 = document.getElementById('captchaQuestion2');
const captchaInput2 = document.getElementById('captchaInput2');
const captchaBtn2 = document.getElementById('captchaBtn2');

let pendingName = '';

function setLang(newLang) {
    lang = newLang;
    document.querySelectorAll('.flag-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.flag-btn[data-lang="${lang}"]`).classList.add('active');

    if (name) {
        mainTitle.innerHTML = `${texts[lang].title}<span class="name">${name}</span>${texts[lang].titleEnd}`;
        yesBtn.textContent = texts[lang].yes;
        noBtn.textContent = texts[lang].no;
    } else {
        createBtn.textContent = texts[lang].create;
        nameInput.placeholder = texts[lang].placeholder;
    }
    qrTextP.textContent = texts[lang].qrText;
}

function createHeart() {
    const h = document.createElement('div');
    h.className = 'heart';
    h.innerHTML = Math.random() > 0.5 ? '💕' : '❤️';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.setProperty('--x', (Math.random() * 50 - 25) + 'vw');
    h.style.setProperty('--drift', (Math.random() * 80 - 40) + 'vw');
    h.style.animationDuration = (7 + Math.random() * 9) + 's';
    h.style.animationDelay = Math.random() * 5 + 's';
    document.getElementById('hearts').appendChild(h);
    setTimeout(() => h.remove(), 18000);
}
setInterval(createHeart, 800);

function showCaptcha(nameVal) {
    pendingName = nameVal;
    captchaTitle.textContent = texts[lang].captchaTitle;
    captchaQuestion1.textContent = texts[lang].q1;
    captchaInput.value = '';
    captchaQuestion2.style.display = 'none';
    captchaInput2.style.display = 'none';
    captchaBtn2.style.display = 'none';
    captchaModal.style.display = 'flex';
}

function checkCaptcha1() {
    const answer = captchaInput.value.trim().toLowerCase().replace(/\s+/g, ' ');
    const correct = texts[lang].q1Answer.toLowerCase();
    if (levenshteinDistance(answer, correct) <= Math.floor(correct.length * 0.35)) {
        captchaQuestion1.textContent = texts[lang].q1Success;
        setTimeout(() => {
            captchaQuestion2.textContent = texts[lang].q2;
            captchaQuestion2.style.display = 'block';
            captchaInput2.style.display = 'block';
            captchaBtn2.style.display = 'block';
            captchaInput.style.display = 'none';
            captchaBtn.style.display = 'none';
            captchaInput2.focus();
        }, 1200);
    } else {
        alert('Неправильно! Спробуй ще раз 💪');
        captchaInput.value = '';
        captchaInput.focus();
    }
}

function checkCaptcha2() {
    const answer = captchaInput2.value.trim().toLowerCase().replace(/\s+/g, ' ');
    const correct = texts[lang].q2Answer.toLowerCase();
    if (levenshteinDistance(answer, correct) <= Math.floor(correct.length * 0.35)) {
        captchaQuestion2.textContent = texts[lang].q2Success;
        setTimeout(() => {
            captchaModal.style.display = 'none';
            const url = `${window.location.origin}${window.location.pathname}?name=${encodeURIComponent(pendingName)}&share=true`;
            window.location.href = url;
        }, 1500);
    } else {
        alert('Неправильно! Спробуй ще раз 💪');
        captchaInput2.value = '';
        captchaInput2.focus();
    }
}

function levenshteinDistance(a, b) {
    const matrix = Array(b.length + 1).fill().map(() => Array(a.length + 1).fill(0));
    for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
    for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
    for (let j = 1; j <= b.length; j++) {
        for (let i = 1; i <= a.length; i++) {
            const indicator = a[i - 1] === b[j - 1] ? 0 : 1;
            matrix[j][i] = Math.min(
                matrix[j][i - 1] + 1,
                matrix[j - 1][i] + 1,
                matrix[j - 1][i - 1] + indicator
            );
        }
    }
    return matrix[b.length][a.length];
}

function generateValentine() {
    let val = nameInput.value.trim();
    if (!val) {
        alert(lang === 'uk' ? "Введи ім'я будь ласка 💕" : "Please enter a name 💕");
        return;
    }
    if (!/^[a-zA-Zа-яА-ЯіїІЇєЄґҐ]+$/.test(val)) {
        alert(texts[lang].invalidName);
        return;
    }
    showCaptcha(val);
}

createBtn.onclick = generateValentine;
captchaBtn.onclick = checkCaptcha1;
captchaBtn2.onclick = checkCaptcha2;

yesBtn.onclick = () => alert(texts[lang].alertYes);

noBtn.onclick = function noFn() {
    const rect = noBtn.getBoundingClientRect();
    const maxX = window.innerWidth - rect.width * 1.2;
    const maxY = window.innerHeight - rect.height * 1.2 - 100;
    const newX = Math.random() * maxX;
    const newY = 80 + Math.random() * maxY;
    noBtn.classList.add('moved');
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
    setTimeout(() => {
        noBtn.onclick = null;
        noBtn.textContent = lang === 'uk' ? 'ТА БЕРИ ТАК 😡' : 'JUST SAY YES 😡';
        noBtn.style.background = '#00ff9d';
        noBtn.style.color = '#000';
    }, 700);
};

function downloadQR() {
    const img = qrDiv.querySelector('img');
    if (!img) return;
    const a = document.createElement('a');
    a.download = `valentine-${name || 'secret'}.png`;
    a.href = img.src;
    a.click();
}

function copyLink() {
    const link = `${window.location.origin}${window.location.pathname}?name=${encodeURIComponent(name)}&share=false`;
    navigator.clipboard.writeText(link).then(() => {
        alert(lang === 'uk' ? "Посилання скопійовано! 💕" : "Link copied! 💕");
    }).catch(() => alert(link));
}

// INIT
if (name) {
    valNameSpan.textContent = name;
    mainTitle.innerHTML = `${texts[lang].title}<span class="name">${name}</span>${texts[lang].titleEnd}`;
    generator.classList.add('hidden');
    valentines.classList.remove('hidden');

    if (share) {
        qrContainer.classList.remove('hidden');
        shareButtons.classList.remove('hidden');

        const link = `${window.location.origin}${window.location.pathname}?name=${encodeURIComponent(name)}&share=false`;

        // Правильне створення QR з qrcode-generator
        const qr = qrcode(0, 'H'); // 0 = auto version, 'H' = high correction
        qr.addData(link);
        qr.make();

        // Створюємо зображення з потрібними параметрами
        qrDiv.innerHTML = qr.createImgTag({
            scalable: true,
            cellSize: 8,     // розмір одного квадратика (як у старої бібліотеки)
            margin: 4
        });
    }
} else {
    generator.classList.remove('hidden');
}

setLang('uk');
</script>
</body>
</html>
