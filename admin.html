<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Валентинка 💌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #ff3366, #cc33ff, #6633ff);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }
        h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            margin-bottom: 40px;
            text-shadow: 0 0 30px rgba(255,255,255,0.8);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        button {
            padding: 20px 60px;
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: bold;
            background: #00ff88;
            color: black;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        button:hover {
            transform: scale(1.1);
            background: #00ffaa;
        }
        #rickroll {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #rickroll iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #rickText {
            font-size: clamp(3rem, 12vw, 10rem);
            color: #ff3366;
            text-shadow: 0 0 40px white;
            margin-bottom: 30px;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .lang-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .lang-btn {
            padding: 10px 20px;
            font-size: 1.2rem;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            border-radius: 30px;
            cursor: pointer;
            margin: 0 10px;
        }
        .lang-btn.active {
            background: white;
            color: black;
        }
    </style>
</head>
<body>

<div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('uk')">Укр</button>
    <button class="lang-btn" onclick="setLang('en')">Eng</button>
</div>

<div id="main">
    <h1 id="title">Прийшла нова валентинка! 💌</h1>
    <button id="openBtn" onclick="rickroll()">Відкрити</button>
</div>

<div id="rickroll">
    <div id="rickText">Ти попався! 😈</div>
    <iframe 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0&showinfo=0&rel=0&loop=1&playlist=dQw4w9WgXcQ" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>
</div>

<script>
let lang = 'uk';

const texts = {
    uk: {
        title: "Прийшла нова валентинка! 💌",
        open: "Відкрити",
        rick: "Ти попався! 😈"
    },
    en: {
        title: "New valentine arrived! 💌",
        open: "Open",
        rick: "You got rickrolled! 😈"
    }
};

function setLang(newLang) {
    lang = newLang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.lang-btn[onclick="setLang('${newLang}')"]`).classList.add('active');
    
    document.getElementById('title').textContent = texts[lang].title;
    document.getElementById('openBtn').textContent = texts[lang].open;
    document.getElementById('rickText').textContent = texts[lang].rick;
}

function rickroll() {
    document.getElementById('main').style.display = 'none';
    document.getElementById('rickroll').style.display = 'flex';
    
    // Спроба автозапуску музики (працює не завжди через політику браузерів)
    const iframe = document.querySelector('iframe');
    iframe.src += ''; // перезавантажуємо для автоплей
}

setLang('uk'); // старт українською
</script>
</body>
</html>
